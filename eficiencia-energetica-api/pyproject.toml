[project]
name = "eficiencia-energetica-api"
version = "1.0.0"
description = "API com dois serviços de IA para apoio à eficiência energética de edifícios públicos (Trabalho final — Construção de APIs para IA, UFG)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
